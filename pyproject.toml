[project]
name = "uk-filings-analyst"
version = "0.1.0"
description = "Evaluated RAG + agent system for Q&A over UK annual reports"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "litellm>=1.50",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pymupdf>=1.24",
    "numpy>=1.26",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "ingestion*"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
