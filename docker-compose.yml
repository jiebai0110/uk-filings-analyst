services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ufa
      POSTGRES_PASSWORD: ufa
      POSTGRES_DB: ufa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ufa"]
      interval: 5s
      retries: 10

  # Langfuse is added in week 3 (observability).

volumes:
  pgdata:
